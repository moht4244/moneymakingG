<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moneymaking G</title>
  <script>
    (function () {
      var path = location.pathname || "";
      var m = path.match(/^(.*\/moneymakingG)(?:\/|$)/i);
      var root = (m ? m[1] : path.replace(/\/[^/]*$/, "") || "") + "/";
      var hash = "#/home";
      var coin = path.match(/\/coin\/([^/]+)/);
      var audit = path.match(/\/audit\/([^/]+)/);
      var bots = path.match(/\/bots\/([^/]+)/);
      if (coin) hash = "#/coin/" + coin[1];
      else if (audit) hash = "#/audit/" + audit[1];
      else if (bots) hash = "#/bots/" + bots[1];
      else if (/\/live\/?$/i.test(path)) hash = "#/live";
      else if (/\/(activity|handelser)\/?$/i.test(path)) hash = "#/live";
      else if (/\/(regler|rules)\/?$/i.test(path)) hash = "#/regler";
      else if (/\/chat\/?/i.test(path)) hash = "#/chat";
      location.replace(root + hash);
    })();
  </script>
</head>
<body>
  <p><a href="./">Öppna Moneymaking G</a></p>
</body>
</html>
